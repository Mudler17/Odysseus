name: Bilder von Wikimedia Commons laden

# Läuft automatisch, sobald das Bildmanifest geändert wird,
# und lässt sich unter „Actions“ jederzeit von Hand starten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/images.json
      - tools/fetch_images.py

permissions:
  contents: write

jobs:
  bilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python tools/fetch_images.py
      - name: Bericht in die Zusammenfassung
        run: cat tools/image-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img index.html tools/image-report.md
          git diff --cached --quiet || git commit -m "Bilder von Wikimedia Commons eingebunden (automatisch)"
          git push
